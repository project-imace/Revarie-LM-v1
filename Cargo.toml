[package]
name = "revarie-cognitive-architecture"
version = "1.0.0"
edition = "2021"
authors = ["Project IMACE <research@imace.online>"]
description = "Cognitive Architecture core for REVARIE LM v1.0"
license = "Apache-2.0"
repository = "https://github.com/project-imace/revarie-lm-v1"

[workspace]
members = [
    "dual-process",
    "global-workspace",
    "active-inference",
    "belief-space",
    "rebound-mechanism",
    "pomdp-engine",
    "jepa-mimetic",
]

[workspace.dependencies]
# Core utilities
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# Async runtime (for API gateway)
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Testing
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
