[package]
name = "revarie-api-gateway"
version = "1.0.0"
edition = "2021"
authors = ["Project IMACE <research@imace.online>"]
description = "High-speed Rust API Gateway and Nervous System for REVARIE LM V1"
license = "Apache-2.0"
repository = "https://github.com/project-imace/revarie-lm-v1"

[[bin]]
name = "revarie-api-gateway"
path = "orchestrator/api-gateway/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
