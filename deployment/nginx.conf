worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    server {
        listen 7860;
        server_name _;

        access_log /tmp/nginx_access.log;
        error_log /tmp/nginx_error.log;

        location /health {
            proxy_pass http://127.0.0.1:3000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/chat {
            # Handle CORS preflight for the browser
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-api-key,revarie-api-key';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Apply CORS to actual requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-api-key,revarie-api-key' always;

            proxy_pass http://127.0.0.1:3000/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /api/admin {
            proxy_pass http://127.0.0.1:3000/admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /internal/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            default_type application/json;
            return 404 '{"error": "Not found"}';
        }
    }
}
