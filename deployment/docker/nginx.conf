server {
    listen 7860;
    server_name _;

    # Rigorous logging for participant tracking
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Global Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gzip compression to save bandwidth for participants on mobile
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # 1. Health Check - Routed to Rust Nervous System
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    # 2. Standard Chat API (Unary)
    location /api/chat {
        proxy_pass http://127.0.0.1:3000/chat;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 3. Streaming Chat API (CRITICAL for your chat_stream_handler)
    # This ensures Samara/Artery responses don't buffer
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:3000/chat/stream;
        
        # Disable buffering for real-time SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        
        # Extended timeouts for long cognitive processing
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 4. Admin API - Key Management
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3000/admin/;
        
        # Basic protection: only allow internal study access if needed
        allow all; 
    }

    # 5. Python Orchestrator (CEO) - Internal Communication
    location /internal/ {
        proxy_pass http://127.0.0.1:8000/;
        client_max_body_size 10M; # For participant context uploads
    }

    # 6. Default Fallback - Research-Grade JSON Error
    location / {
        add_header Content-Type application/json;
        return 404 '{"status": 404, "error": "REVARIE LM V1: Resource Not Found", "participant_action": "Check session_id"}';
    }

    # Custom Error Pages for the 14-day study stability
    error_page 502 503 504 /custom_50x.json;
    location = /custom_50x.json {
        return 503 '{"error": "Cognitive Engine Timeout", "detail": "The server is currently processing high-volume participant data."}';
    }
}
