name: Sync to Hugging Face Hub

on:
  push:
    branches: [Production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip Binaries and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Physically remove the offenders in the runner
          rm -rf build/
          rm -f test_sf test_kg
          
          # 2. Configure Git in the runner
          git config --global user.email "bot@revarie.me"
          git config --global user.name "Revarie Deploy Bot"
          
          # 3. Create a temporary 'clean' branch
          git checkout -b temp-deploy-branch
          
          # 4. Commit the removal (even if files are already gone)
          git add .
          git commit -m "Internal: Stripping binaries for HF compliance" || echo "No changes to commit"
          
          # 5. Push this clean state to HF's main branch
          git push --force https://ariartry:$HF_TOKEN@huggingface.co/spaces/ariartry/revarie-engine-v1 temp-deploy-branch:main
