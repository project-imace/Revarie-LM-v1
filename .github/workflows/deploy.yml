name: Sync to Hugging Face Hub

on:
  push:
    branches: [Production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge History and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Physically remove the binary offenders
          rm -rf build/
          rm -f test_sf test_kg
          
          # 2. THE NUCLEAR FIX: Delete the .git history folder in the runner
          rm -rf .git
          
          # 3. Re-initialize as a brand new, clean repository
          git init
          git config --global user.email "bot@revarie.me"
          git config --global user.name "Revarie Deploy Bot"
          
          # 4. Add ONLY the current source code
          git add .
          git commit -m "Rigorous clean-slate deployment (Binary Purged)"
          
          # 5. Force push this single 'clean' commit to HF
          # We push the local 'master' (default for git init) to HF 'main'
          git push --force https://ariartry:$HF_TOKEN@huggingface.co/spaces/ariartry/revarie-engine-v1 master:main
