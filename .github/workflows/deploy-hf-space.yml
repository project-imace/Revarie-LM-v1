name: Deploy to Hugging Face Space

on:
  push:
    branches: [Production]
    paths:
      - 'cognitive-architecture/**'
      - 'persona-engine/**'
      - 'orchestrator/**'
      - 'rag-pipeline/**'
      - 'deployment/docker/**'
      - 'deployment/huggingface/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Optional: ensure tests pass before deploying
    # needs: [test-cognitive-core, test-persona-engine, test-orchestrator, test-integration]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://huggingface.co/spaces/project-imace/revarie-lm-v1-engine
          # Authenticate using token
          git push --force https://project-imace:${HF_TOKEN}@huggingface.co/spaces/project-imace/revarie-lm-v1-engine HEAD:main
