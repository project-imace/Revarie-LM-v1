name: Deploy to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [ "Production" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: deploy-hf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Hugging Face CLI
        run: pip install huggingface-hub
      - name: Deploy via CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload project-imace/revarie-lm-v1-engine . \
            --repo-type=space \
            --space-sdk=docker
