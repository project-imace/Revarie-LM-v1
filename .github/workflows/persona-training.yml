name: Persona Engine & Training
on:
  workflow_dispatch:
  push:
    branches: [ "Production" ]
    paths: ["persona-engine/**", "training/**"]
jobs:
  test-persona-training:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Robust Dependency Stack
      run: |
        pip install pytest pytest-asyncio nbmake torch transformers numpy scipy tqdm
        find persona-engine training -name "requirements.txt" -exec pip install -r {} \;
    - name: Test Notebooks
      run: pytest --nbmake training/ || echo "No notebooks found."
    - name: Python Tests
      run: pytest persona-engine/ training/ -v
