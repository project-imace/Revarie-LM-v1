name: Test Cognitive Core

on:
  push:
    branches: [ "Production" ]
  pull_request:
    branches: [ "Production" ]

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake build-essential libboost-all-dev
    - name: Build and Test C++
      run: |
        cd cognitive-architecture
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
        make -j$(nproc)
        ctest --output-on-failure

  test-rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Test Rust
      run: |
        cd cognitive-architecture
        cargo test --release

  test-lisp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install SBCL and Quicklisp
      run: |
        sudo apt-get update && sudo apt-get install -y sbcl cl-asdf curl
        curl -O https://beta.quicklisp.org/quicklisp.lisp
        sbcl --no-sysinit --no-userinit --load quicklisp.lisp --eval '(quicklisp-quickstart:install)' --eval '(ql-util:without-prompting (ql:add-to-init-file))' --eval '(quit)'
    - name: Test Lisp
      run: |
        cd cognitive-architecture
        sbcl --noinform --disable-debugger \
             --eval "(ql:quickload :fiveam)" \
             --eval "(asdf:load-asd (merge-pathnames \"revarie-cognitive-architecture.asd\" (uiop:getcwd)))" \
             --eval "(ql:quickload :revarie-cognitive-architecture/tests)" \
             --eval "(asdf:test-system :revarie-cognitive-architecture/tests)" \
             --eval "(quit)"
