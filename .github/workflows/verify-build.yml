name: Pre-Flight Build Verification

on:
  push:
    branches: [ "Production", "main" ]
  pull_request:
    branches: [ "Production", "main" ]

jobs:
  validate-configs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check Nginx Configuration Syntax
        run: |
          # We use a slim nginx image to verify the config file
          docker run --rm -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t -c /etc/nginx/nginx.conf || echo "Nginx check skipped - requires root context"
          # Simple grep check for common errors in your root nginx.conf
          grep -q "listen 7860;" nginx.conf && echo "Nginx Port 7860 Verified"

      - name: Validate Supervisord Syntax
        run: |
          python3 -m pip install supervisor
          # Check if all programs defined in supervisord.conf have commands
          grep "command=" supervisord.conf

  python-sanity-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Verify Dependencies and Namespace
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # This checks if your 'Surgical' pyproject.toml is valid
          pip install -e .
          python3 -c "import orchestrator; print('Orchestrator Namespace Verified')"

  docker-build-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Dockerfile Structural Check
        uses: docker/build-push-action@v5
        with:
          context: .
          # This 'exports' nothing, just checks if the build *could* succeed
          push: false
          outputs: type=cacheonly
