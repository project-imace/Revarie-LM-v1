name: Pre-Flight Build Verification

on:
  push:
    branches: [ "Production", "main" ]
  pull_request:
    branches: [ "Production", "main" ]

jobs:
  validate-configs:
    name: Config & File Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Critical File Presence
        run: |
          ls Cargo.toml pyproject.toml Dockerfile supervisord.conf nginx.conf
          ls main.cpp main.lisp orchestrator/main.py
          echo "All core files present."

      - name: Validate Nginx Site Configuration
        run: |
          grep -q "listen 7860;" nginx.conf || (echo "ERROR: nginx.conf must listen on 7860" && exit 1)
          grep -q "proxy_pass http://127.0.0.1:3000" nginx.conf || (echo "ERROR: Nginx not pointing to Rust Gateway" && exit 1)
          echo "Nginx site logic verified."

      - name: Validate Supervisord Syntax
        run: |
          python3 -m pip install supervisor
          for prog in nginx rust-api python-orchestrator cpp-reasoner lisp-engine; do
            grep -q "program:$prog" supervisord.conf || (echo "ERROR: Missing program $prog in supervisord" && exit 1)
          done
          echo "Supervisord process map verified."

  python-sanity-check:
    name: Python CEO Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Verify Dependencies and Namespace
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python3 -c "import orchestrator; print('Orchestrator Namespace Verified')"

  docker-build-dry-run:
    name: Docker Global Build (Dry Run)
    runs-on: ubuntu-24.04
    needs: [validate-configs, python-sanity-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
