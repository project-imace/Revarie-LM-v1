name: Test Orchestrator

on:
  push:
    branches: [Production]
    paths:
      - 'orchestrator/**'
  pull_request:
    branches: [Production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Run Python tests
        run: |
          cd orchestrator
          pip install pytest pytest-asyncio
          # Recursively find and run all pytest suites in orchestrator
          find . -type d -name "tests" -exec pytest {} -v \;

  test-rust-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        run: cd orchestrator/api-gateway && cargo test --release
      - name: Compile C++ Tests
        run: |
          cd orchestrator/api-key-vault/tests
          g++ -std=c++17 -DTEST_RATE_LIMIT_MONITOR -o test_rlm test_rate_limit_monitor.cpp
          ./test_rlm
