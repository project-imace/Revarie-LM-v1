name: Orchestrator & Integration
on:
  workflow_dispatch:
  push:
    branches: [ "Production" ]
    paths: ["orchestrator/**", "tests/**"]
jobs:
  test-gateway-and-integration:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Robust Dependency Stack
      run: |
        pip install pytest pytest-asyncio aiohttp pydantic python-dotenv hypothesis pytest-mock
        find orchestrator tests -name "requirements.txt" -exec pip install -r {} \;
    - name: Rust API Gateway Tests
      run: find orchestrator -name "Cargo.toml" -execdir cargo test --release \;
    - name: Python Orchestrator & Integration Tests
      run: |
        export PYTHONPATH="$(pwd):$PYTHONPATH"
        pytest orchestrator/ tests/ -v
